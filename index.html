<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>智慧水壺控制中心 V3.1 (穩定版)</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;background:#f4f7fb;color:#1f2937}
header{background:white;padding:22px;box-shadow:0 1px 8px rgba(0,0,0,0.07)}
h1{margin:0;font-size:25px;color:#1e293b}
.sub{color:#6b7280;margin-top:5px;font-size:14px}
main{max-width:920px;margin:auto;padding:20px;display:grid;gap:16px}
.card{background:white;border-radius:18px;padding:20px;box-shadow:0 4px 18px rgba(0,0,0,0.04)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.label{font-size:14px;color:#6b7280}
.big{text-align:center;font-size:40px;font-weight:750;margin:12px 0;color:#0f172a}
input{width:100%;padding:12px;border:1px solid #d7dce3;border-radius:10px;font-size:16px;margin-top:7px}
button{border:0;border-radius:10px;padding:12px 16px;font-size:16px;font-weight:650;cursor:pointer;background:#2563eb;color:white;transition:0.2s}
button:hover{background:#1d4ed8}
button.secondary{background:#eef2f7;color:#374151}
button.danger{background:#fee2e2;color:#dc2626}
.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.row>div{flex:1;min-width:150px}
.status{display:inline-block;padding:7px 12px;border-radius:999px;background:#eef2f7;font-weight:650;font-size:14px}
.progress{height:16px;background:#e9edf2;border-radius:999px;overflow:hidden;margin:10px 0}
.bar{height:100%;width:0;background:#2563eb;transition:.5s}
.led{width:20px;height:20px;border-radius:50%;display:inline-block;vertical-align:middle;margin-right:8px;background:#9ca3af}
.note{font-size:13px;color:#6b7280;line-height:1.6}
.highlight{font-size:18px;font-weight:700;margin-top:10px}
.success{color:#16803c}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
.card-header h2{margin:0;font-size:20px}
table{width:100%;border-collapse:collapse}
td,th{padding:10px;border-bottom:1px solid #edf0f4;text-align:left}
</style>
</head>
<body>

<header>
<h1>智慧水壺控制中心 <span style="font-size:14px;color:#2563eb;background:#dbeafe;padding:3px 8px;border-radius:6px">V3.1 BLE</span></h1>
<div class="sub">HX711 準確感測・WS2812B 提醒控制・飲水數據持久化記錄</div>
</header>

<main>
<!-- 每日目標計算區 -->
<section class="card">
<h2>每日飲水量建議計算</h2>
<div class="row">
<div><label>身高 (cm)</label><input id="height" type="number" placeholder="例: 170"></div>
<div><label>體重 (kg)</label><input id="bodyWeight" type="number" step="0.1" placeholder="例: 65"></div>
<div><button onclick="calculateWater()">計算建議量</button></div>
</div>
<div id="calcResult" class="highlight">輸入身高體重後即可獲得建議飲水量</div>
</section>

<!-- 今日進度 -->
<section class="card">
<div class="card-header">
<h2>今日飲水進度</h2>
<button class="danger" style="padding:6px 12px;font-size:13px" onclick="resetToday()">清空今日紀錄</button>
</div>
<div class="grid">
<div><div class="label">今日累計</div><div class="big"><span id="todayVal">0</span><small style="font-size:16px"> ml</small></div></div>
<div><div class="label">每日目標</div><div class="big"><span id="goal">--</span><small style="font-size:16px"> ml</small></div></div>
<div><div class="label">剩餘目標</div><div class="big"><span id="remaining">--</span><small style="font-size:16px"> ml</small></div></div>
</div>
<div class="progress"><div class="bar" id="drinkBar"></div></div>
<div id="percent" class="label">請設定每日目標</div>
</section>

<!-- 硬體即時狀態 -->
<section class="card">
<div class="grid">
<div><div class="label">目前水壺重量 (HX711)</div><div class="big"><span id="weight">0</span><small style="font-size:16px"> g</small></div></div>
<div><div class="label">藍牙連線狀態</div><div style="margin-top:20px"><span id="status" class="status">未連線</span></div></div>
<div><div class="label">燈條提醒狀態</div><div style="margin-top:20px"><span class="led" id="led"></span><b id="ledText">未啟用</b></div></div>
</div>
</section>

<!-- 提醒與門檻設定 -->
<section class="card">
<h2>飲水提醒與門檻設定</h2>
<div class="row">
<div><label>提醒間隔（分鐘）</label><input id="interval" type="number" min="1"></div>
<div><label>單次飲水門檻 (ml/g)</label><input id="threshold" type="number" min="1"></div>
<div><button onclick="saveSettings()">儲存並同步至水壺</button></div>
</div>
</section>

<!-- 倒數計時 -->
<section class="card">
<h2>下一次喝水提醒倒數</h2>
<div class="big" id="countdown">--:--</div>
<div class="progress"><div id="timeBar" class="bar"></div></div>
</section>

<!-- 連線與模擬控制 -->
<section class="card">
<h2>藍牙連線與測試</h2>
<div class="row">
<div><button id="bleBtn" onclick="connectBLE()"> 連線 ESP32 智慧水壺</button></div>
<div><button class="secondary" onclick="demoDrink()"> 模擬喝水測試 (+150ml)</button></div>
</div>
</section>

<!-- 飲水歷史紀錄 -->
<section class="card">
<h2>今日飲水歷史明細</h2>
<table>
<thead><tr><th>時間</th><th>喝水量</th></tr></thead>
<tbody id="log"></tbody>
</table>
</section>
</main>

<script>
const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
const CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";

let bluetoothDevice = null;
let weightCharacteristic = null;
let hasAlerted = false;
let bleBuffer = "";

const getLocal = (k, d) => JSON.parse(localStorage.getItem(k) || JSON.stringify(d));

// 每日跨日自動重置
(function checkNewDay() {
const lastDate = localStorage.getItem('bottleLastDate');
const todayDate = new Date().toLocaleDateString();
if (lastDate !== todayDate) {
localStorage.setItem('bottleToday', 0);
localStorage.setItem('bottleLogs', JSON.stringify([]));
localStorage.setItem('bottleLastDate', todayDate);
}
})();

let profile = getLocal('bottleProfile', {height:'', weight:'', goal:0});
let settings = getLocal('bottleSettings', {interval:60, threshold:10});
let todayAmount = Number(localStorage.getItem('bottleToday') || 0);
let logs = getLocal('bottleLogs', []);
let lastDrink = Number(localStorage.getItem('bottleLastDrink') || Date.now());

// 渲染輸入欄位初始值
document.getElementById('height').value = profile.height;
document.getElementById('bodyWeight').value = profile.weight;
document.getElementById('interval').value = settings.interval;
document.getElementById('threshold').value = settings.threshold;

// --- Web BLE 雙向傳輸機制 ---

async function connectBLE() {
const statusEl = document.getElementById('status');
const bleBtn = document.getElementById('bleBtn');
try {
statusEl.textContent = '搜尋裝置中...';
statusEl.style.background = '#fef3c7';
statusEl.style.color = '#92400e';

bluetoothDevice = await navigator.bluetooth.requestDevice({
filters: [{ name: 'ESP32_SmartBottle' }],
optionalServices: [SERVICE_UUID]
});

bluetoothDevice.addEventListener('gattserverdisconnected', onDisconnected);

const server = await bluetoothDevice.gatt.connect();
const service = await server.getPrimaryService(SERVICE_UUID);
weightCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

await weightCharacteristic.startNotifications();
weightCharacteristic.addEventListener('characteristicvaluechanged', handleBLEMessage);

// 連線成功後同步設定門檻
await sendCommandToESP32("TARGET:" + settings.threshold);

statusEl.textContent = '已成功連線';
statusEl.style.background = '#dcfce7';
statusEl.style.color = '#166534';
bleBtn.textContent = '✓ 已連線 ESP32';
bleBtn.style.background = '#16a34a';

// ⭐ 每次只要點擊連線成功，立刻重置計時器！
resetTimerOnConnect();

} catch (err) {
console.error('BLE 連線失敗:', err);
statusEl.textContent = '連線失敗 / 中斷';
statusEl.style.background = '#fee2e2';
statusEl.style.color = '#991b1b';
}
}

// 裝置斷線處理
function onDisconnected() {
const statusEl = document.getElementById('status');
statusEl.textContent = '已斷線，請重新連線';
statusEl.style.background = '#fee2e2';
statusEl.style.color = '#991b1b';

const bleBtn = document.getElementById('bleBtn');
bleBtn.textContent = ' 重新連線 ESP32 智慧水壺';
bleBtn.style.background = '#2563eb';

weightCharacteristic = null;
bleBuffer = "";
}

async function sendCommandToESP32(command) {
if (!weightCharacteristic) return;
try {
const encoder = new TextEncoder();
const data = encoder.encode(command);
if (weightCharacteristic.writeValueWithResponse) {
await weightCharacteristic.writeValueWithResponse(data);
} else {
await weightCharacteristic.writeValue(data);
}
console.log("發送指令給 ESP32:", command);
} catch (err) {
console.error("發送指令失敗:", err);
}
}

// 接收與解析 ESP32 訊息
function handleBLEMessage(event) {
const decoder = new TextDecoder('utf-8');
bleBuffer += decoder.decode(event.target.value);

let lines = bleBuffer.split('\n');
bleBuffer = lines.pop();

for (const line of lines) {
const drinkMatch = line.match(/^DRINK:([\d.]+)$/);
if (drinkMatch) {
const drankAmount = parseFloat(drinkMatch[1]);
if (!isNaN(drankAmount) && drankAmount > 0) {
console.log("收到完整喝水事件，數量:", drankAmount);
registerDrink(drankAmount);
}
continue;
}

const weightMatch = line.match(/^W:([\d.]+)$/);
if (weightMatch) {
const currentWeight = parseFloat(weightMatch[1]);
if (!isNaN(currentWeight)) {
document.getElementById('weight').textContent = Math.max(0, Math.round(currentWeight));
}
}
}

if (bleBuffer.length > 100) bleBuffer = "";
}

// --- 介面控制與計時邏輯 ---

function resetTimerOnConnect() {
lastDrink = Date.now();
hasAlerted = false;
localStorage.setItem('bottleLastDrink', lastDrink);
setLED('off', '等待下一次提醒');
tick();
console.log("已透過藍牙連線成功自動重置喝水提醒倒數！");
}

function calculateWater(){
let h = Number(document.getElementById('height').value);
let w = Number(document.getElementById('bodyWeight').value);
if(!h || !w){ alert('請輸入有效的身高與體重'); return; }
profile = {height:h, weight:w, goal:Math.round((h + w) * 10)};
localStorage.setItem('bottleProfile', JSON.stringify(profile));
document.getElementById('calcResult').innerHTML = `建議每日目標：<span class="success">${profile.goal} ml</span>`;
updateProgress();
}

function updateProgress(){
let g = profile.goal;
document.getElementById('goal').textContent = g || '--';
if(!g){
document.getElementById('remaining').textContent = '--';
document.getElementById('drinkBar').style.width = '0%';
document.getElementById('percent').textContent = '請先計算或設定目標';
return;
}
let remain = Math.max(0, g - todayAmount);
let p = Math.min(100, Math.round(todayAmount / g * 100));
document.getElementById('todayVal').textContent = todayAmount;
document.getElementById('remaining').textContent = remain;
document.getElementById('drinkBar').style.width = p + '%';
document.getElementById('percent').textContent = p >= 100 ? '🎉 今日飲水目標已達成！' : `進度 ${p}% ・ 還差 ${remain} ml`;
}

function resetToday(){
if(confirm('確定要清空今天的飲水紀錄嗎？')){
todayAmount = 0;
logs = [];
localStorage.setItem('bottleToday', 0);
localStorage.setItem('bottleLogs', JSON.stringify([]));
renderLogs();
updateProgress();
}
}

async function saveSettings(){
settings = {
interval: Number(document.getElementById('interval').value),
threshold: Number(document.getElementById('threshold').value)
};
if (!settings.interval || settings.interval < 1) settings.interval = 60;
if (!settings.threshold || settings.threshold < 1) settings.threshold = 10;

localStorage.setItem('bottleSettings', JSON.stringify(settings));

lastDrink = Date.now();
hasAlerted = false;
localStorage.setItem('bottleLastDrink', lastDrink);
tick();

await sendCommandToESP32("TARGET:" + settings.threshold);
alert('設定已儲存並同步至 ESP32！');
}

function setLED(state, text){
const colors = {off:'#9ca3af', green:'#22c55e', red:'#ef4444'};
const led = document.getElementById('led');
const ledText = document.getElementById('ledText');
led.style.background = colors[state];
led.style.boxShadow = state === 'off' ? 'none' : `0 0 12px ${colors[state]}`;
ledText.textContent = text;
}

function demoDrink(){
registerDrink(150);
}

function registerDrink(amount){
amount = Math.round(amount);
todayAmount += amount;
let now = new Date();
logs.push({
time: now.toLocaleTimeString('zh-TW', {hour:'2-digit', minute:'2-digit'}),
amount: amount
});

lastDrink = Date.now();
hasAlerted = false;

localStorage.setItem('bottleToday', todayAmount);
localStorage.setItem('bottleLogs', JSON.stringify(logs));
localStorage.setItem('bottleLastDrink', lastDrink);

renderLogs();
updateProgress();

setLED('green', '偵測到喝水達標 ✓');
sendCommandToESP32('LED_OFF');

setTimeout(() => setLED('off', '等待下一次提醒'), 3000);
}

function renderLogs(){
const logEl = document.getElementById('log');
logEl.innerHTML = '';
logs.slice().reverse().forEach(x => {
let tr = document.createElement('tr');
tr.innerHTML = `<td>${x.time}</td><td>+${x.amount} ml</td>`;
logEl.appendChild(tr);
});
}

function tick(){
let total = settings.interval * 60000;
let elapsed = Date.now() - lastDrink;
let remain = Math.max(0, total - elapsed);

let m = Math.floor(remain / 60000);
let s = Math.floor((remain % 60000) / 1000);
document.getElementById('countdown').textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
document.getElementById('timeBar').style.width = Math.min(100, (elapsed / total) * 100) + '%';

if (remain <= 0) {
setLED('red', '提醒時間到！請喝水');
if (!hasAlerted) {
sendCommandToESP32('LED_ON');
hasAlerted = true;
}
}
}

renderLogs();
updateProgress();
if (profile.goal) {
document.getElementById('calcResult').innerHTML = `建議每日目標：<span class="success">${profile.goal} ml</span>`;
}
setInterval(tick, 1000);
tick();
</script>
</body>
</html>
